name: Python

on:
  push:
    paths:
      - ".github/workflows/python.yml"
      - "build.sh"
      - "projects/core/**"
      - "projects/py/**"
      - "protocol/golden-vectors.json"
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - "build.sh"
      - "projects/core/**"
      - "projects/py/**"
      - "protocol/golden-vectors.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/py/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/core
      - run: python -m pip install --upgrade pip build setuptools wheel
      - run: python -m pip install -e projects/py
      - run: ./build.sh test-py
      - run: ./build.sh py
